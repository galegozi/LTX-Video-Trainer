# Multi-Channel Physics Simulation Configuration
# This configuration enables true multi-channel input/output

# Model configuration
model:
  model_source: "LTXV_13B_097_DEV"
  training_mode: "lora"
  load_checkpoint: null

# LoRA configuration
lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

# Conditioning configuration
conditioning:
  mode: "none"
  first_frame_conditioning_p: 1.0  # Always condition on first frame

# Optimization configuration
optimization:
  learning_rate: 2e-4
  steps: 2000
  batch_size: 1  # Keep low for multi-channel (high memory usage)
  gradient_accumulation_steps: 4  # Effective batch size of 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true  # Important for multi-channel

# Acceleration optimization
acceleration:
  mixed_precision_mode: "bf16"  # Helps with memory
  quantization: null  # Can use "int8-quanto" to further reduce memory
  load_text_encoder_in_8bit: false
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

# Data configuration - MULTI-CHANNEL MODE
data:
  preprocessed_data_root: "/path/to/preprocessed/data"
  num_dataloader_workers: 2
  
  # NPZ settings
  npz_initial_frame_index: 0
  npz_channel_names:  # Specify your channel names in order
    - "temperature"
    - "pressure"
    - "density"
    - "velocity_x"
    - "velocity_y"
    - "velocity_z"
    - "energy"
    - "vorticity"
    - "entropy"
    - "turbulence"
  npz_preserve_all_channels: true
  
  # MULTI-CHANNEL VAE SETTINGS - NEW!
  use_multi_channel_vae: true  # Enable multi-channel mode
  num_channels: 10  # Total number of channels (must match channel_names length)
  channel_grouping_strategy: "sequential"  # Options: "sequential" or "interleaved"

# Validation configuration
validation:
  prompts:
    - "Multi-channel physics simulation with 10 fields"
    - "Turbulent flow with temperature and velocity gradients"
    - "High-energy plasma dynamics simulation"
  
  images:  # First frames for conditioning
    - "/path/to/first_frames/sim_001.png"
    - "/path/to/first_frames/sim_002.png"
    - "/path/to/first_frames/sim_003.png"
  
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  video_dims: [512, 512, 101]  # [width, height, frames]
  seed: 42
  inference_steps: 50
  interval: 250
  videos_per_prompt: 1
  guidance_scale: 3.5
  
  # Visualization settings
  output_fps: 20.0
  visualization_script: null
  save_comparison_gif: true

# Checkpoint configuration
checkpoints:
  interval: 250
  keep_last_n: 3

# Flow matching configuration
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

# HuggingFace Hub configuration
hub:
  push_to_hub: false
  hub_model_id: null

# W&B configuration
wandb:
  enabled: false
  project: "ltxv-multi-channel-physics"
  entity: null
  tags: ["multi-channel", "physics", "10-channels"]
  log_validation_videos: true

# General configuration
seed: 42
output_dir: "outputs/multi_channel_physics"
